<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Data Cleaners - Manual Mode</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>Data Cleaners - Manual Mode</h1>
            <nav>
                <span id="user-info" class="user-info">Loading...</span>
                <div class="mode-toggle">
                    <button id="mode-toggle-btn" class="mode-btn" onclick="toggleMode()">
                        <span class="mode-text">AI Mode</span>
                    </button>
                </div>
                <a href="/logout" class="logout-btn">Logout</a>
            </nav>
        </header>

        <div class="container">
            <h2>Manual Entry System</h2>
            <p>Frontend to create, update, and delete customers.</p>
        
        <div id="message-container"></div>

        <div class="card">
            <h2> Current Customers</h2>
            <div id="customer-table-container">
                <p>Loading customers...</p>
            </div>
        </div>

        <hr>

        <div class="forms-grid">
            <div class="card">
                <h2>Create Customer</h2>
                <form id="form_create">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="create_name">Name</label>
                            <input type="text" id="create_name" required>
                        </div>
                        <div class="form-group">
                            <label for="create_email">Email</label>
                            <input type="email" id="create_email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="create_address">Address</label>
                        <input type="text" id="create_address" required>
                    </div>
                    <div class="form-group">
                        <label for="create_date">Cleaning Date</label>
                        <input type="date" id="create_date" required>
                    </div>
                    <button type="submit">Create Customer</button>
                </form>
            </div>

            <div class="card">
                <h2> Update Cleaning Date</h2>
                <form id="form_update">
                    <div class="form-group">
                        <label for="update_email">Customer Email</label>
                        <input type="email" id="update_email" required>
                    </div>
                    <div class="form-group">
                        <label for="update_date">New Date</label>
                        <input type="date" id="update_date" required>
                    </div>
                    <button type="submit">Update Date</button>
                </form>
            </div>

            <div class="card">
                <h2> Delete Customer</h2>
                <form id="form_delete">
                    <div class="form-group">
                        <label for="delete_email">Customer Email</label>
                        <input type="email" id="delete_email" required>
                    </div>
                    <button type="submit" class="danger">Delete Customer</button>
                </form>
            </div>
        </div>
        </div>
    </div>
    
    <script>
        // Mode toggle functionality for manual page
        document.addEventListener("DOMContentLoaded", () => {
            // Load user information (same as dashboard)
            loadUserInfo();
        });
        
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/auth/status');
                const data = await response.json();
                
                if (data.logged_in) {
                    const userInfo = document.getElementById('user-info');
                    if (userInfo) {
                        userInfo.textContent = `Welcome, ${data.user.name}`;
                    }
                } else {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Error loading user info:', error);
                window.location.href = '/login';
            }
        }
        
        // Global function for the toggle button onclick
        function toggleMode() {
            window.location.href = '/';
        }
    </script>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
