<!--
================================================================================
Unit Cleaning - MANUAL BOOKING INTERFACE
================================================================================
Manual booking and appointment management interface for staff/admin users
Provides forms for creating, rescheduling, and managing customer appointments

Features:
- Manual appointment booking with customer details
- Appointment rescheduling functionality  
- Current appointments display table
- Address and service selection dropdowns
- Notification preference settings
- Form validation and error handling

Dependencies:
- style.css: Main styling and responsive layout
- Manual_insert.js: Form handling and API communication
- Flask backend: Authentication and booking APIs
- Database: Customer addresses and appointment storage

Author: Unit Cleaning Team
Last Modified: [Current Date]
================================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Unit Cleaning - Manual Mode</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Main container for manual booking interface -->
    <div class="dashboard-container">
        <!-- Header with navigation and mode toggle -->
        <header class="dashboard-header">
            <h1>Unit Cleaning - Manual Mode</h1>
            <nav>
                <!-- User information display -->
                <span id="user-info" class="user-info">Loading...</span>
                
                <!-- Toggle back to AI mode button -->
                <div class="mode-toggle">
                    <button id="mode-toggle-btn" class="mode-btn" onclick="toggleMode()">
                        <span class="mode-text">AI Mode</span>
                    </button>
                </div>
                
                <!-- Logout link -->
                <a href="/logout" class="logout-btn">Logout</a>
            </nav>
        </header>

        <!-- Main content container -->
        <div class="container">
            <h2>Manual Entry System</h2>
            <p>Frontend to create, update, and delete customers.</p>
        
            <!-- Message display area for form feedback -->
            <div id="message-container"></div>

            <!-- Calendar container (replaces direct date/time inputs) -->
            <div class="card">
                <h2>Calendar</h2>
                <div id="manual-calendar-container">
                    <!-- Calendar skeleton injected by JS -->
                    <p>Loading calendar…</p>
                </div>
            </div>

            <!-- Current appointments display section -->
            <div class="card">
                <h2> Current Appointments</h2>
                <div id="customer-table-container">
                    <!-- Appointments table populated by JavaScript -->
                    <p>Loading appointments...</p>
                </div>
            </div>

            <hr>

        </div>
    </div>
    
    <!-- Inline JavaScript for page initialization and basic functionality -->
    <script>
        // ================================================
        // PAGE INITIALIZATION AND AUTHENTICATION
        // ================================================
        
        /**
         * Initialize manual booking page after DOM load
         * Loads user authentication status and info
         */
        document.addEventListener("DOMContentLoaded", () => {
            // Load user information from authentication API
            loadUserInfo();
        });
        
        /**
         * Load and display current user information
         * Redirects to login if user is not authenticated
         */
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/auth/status');
                const data = await response.json();
                
                if (data.logged_in) {
                    // Display welcome message with user name
                    const userInfo = document.getElementById('user-info');
                    if (userInfo) {
                        userInfo.textContent = `Welcome, ${data.user.name}`;
                    }
                } else {
                    // Redirect to login if not authenticated
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Error loading user info:', error);
                // Redirect to login on error
                window.location.href = '/login';
            }
        }
        
        /**
         * Toggle back to AI mode (dashboard)
         * Called by mode toggle button onclick event
         */
        function toggleMode() {
            window.location.href = '/';
        }
    </script>
    
    <!-- Main manual booking functionality script -->
    <script src="{{ url_for('static', filename='js/calendar_widget.js') }}"></script>
    <script src="{{ url_for('static', filename='js/Manual_insert.js') }}"></script>
</body>
</html>
