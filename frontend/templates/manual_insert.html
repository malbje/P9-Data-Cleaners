<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cleaning Schedule - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1> Manual Data Entry</h1>
            <nav>
                <a href="/">Main Page</a>
                <a href="/manual" class="active">Manual Entry</a>
            </nav>
        </header>
        
        <div id="message-container"></div>

        <div class="card">
            <h2> Current Appointments</h2>
            <div id="customer-table-container">
                <p>Loading appointments...</p>
            </div>
        </div>

        <hr>

        <div class="forms-grid">
            <!-- Book Appointment Form -->
            <div class="card">
                <h2>Book Appointment</h2>
                <form id="form_create">
                    <div class="form-group">
                        <label for="create_address">Address</label>
                        <input type="text" id="create_address" required placeholder="e.g., 123 Main St, Aalborg">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                             <label for="create_name">Customer Name</label>
                            <input type="text" id="create_name" required>
                        </div>
                        <div class="form-group">
                            <label for="create_email">Customer Email</label>
                            <input type="email" id="create_email">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="create_date">Date</label>
                            <input type="date" id="create_date" required>
                        </div>
                        <div class="form-group">
                            <label for="create_time">Time</label>
                            <input type="time" id="create_time" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="create_notification">Notification Preference</label>
                        <select id="create_notification">
                            <option value="No notification">No notification</option>
                            <option value="1 hour before">1 hour before</option>
                            <option value="3 hours before">3 hours before</option>
                            <option value="24 hours before">24 hours before</option>
                            <option value="3 days before">3 days before</option>
                            <option value="1 week before">1 week before</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="create_service">Service / Notes</label>
                        <textarea id="create_service" rows="3" placeholder="e.g., Standard weekly cleaning"></textarea>
                    </div>
                    <button type="submit">Book Appointment</button>
                </form>
            </div>

            <!-- Reschedule Appointment Form -->
            <div class="card">
                <h2> Reschedule Appointment</h2>
                <form id="form_update">
                    <div class="form-group">
                        <label for="update_address">Customer Address</label>
                        <input type="text" id="update_address" placeholder="Type address to find appointments" required>
                    </div>
                    <div class="form-group">
                        <label for="update_appointment_select">Select Appointment to Reschedule</label>
                        <select id="update_appointment_select" required disabled>
                            <option value="">-- Enter address first --</option>
                        </select>
                    </div>
                    <hr class="form-divider">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="update_date">New Date</label>
                            <input type="date" id="update_date" required>
                        </div>
                        <div class="form-group">
                            <label for="update_time">New Time</label>
                            <input type="time" id="update_time" required>
                        </div>
                    </div>
                     <div class="form-group">
                        <label for="update_notification">Notification Preference</label>
                        <select id="update_notification">
                            <option value="No notification">No notification</option>
                            <option value="1 hour before">1 hour before</option>
                            <option value="3 hours before">3 hours before</option>
                            <option value="24 hours before">24 hours before</option>
                            <option value="3 days before">3 days before</option>
                            <option value="1 week before">1 week before</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="update_service">Service / Notes</label>
                        <textarea id="update_service" rows="3"></textarea>
                    </div>
                    <button type="submit">Reschedule</button>
                </form>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/manual_insert.js') }}"></script>
</body>
</html>
