<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Data Cleaners - Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
   <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css', v='1.0') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-header">
            <h1> Data Cleaners</h1>
            <p>Professional Cleaning Management System</p>
        </div>

        <div class="auth-card">
            <!-- Toggle buttons -->
            <div class="auth-toggle">
                <button class="toggle-btn" id="login-toggle">Log In</button>
                <button class="toggle-btn active" id="signup-toggle">Sign Up</button>
            </div>

            <!-- Sign Up Form -->
            <form class="auth-form" id="signup-form">
                <h2>Create Account</h2>
                <p class="auth-subtitle">Join Data Cleaners today</p>
                
                <!-- Personal Information -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="signup-firstname">First Name</label>
                        <input type="text" id="signup-firstname" name="firstname" required placeholder="First name">
                    </div>
                    <div class="form-group">
                        <label for="signup-lastname">Last Name</label>
                        <input type="text" id="signup-lastname" name="lastname" required placeholder="Last name">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" name="email" required placeholder="Enter your email">
                </div>
                
                <!-- Notifications Preference -->
                <div class="form-group">
                    <label for="signup-notifications" class="form-label">Notification preference</label>
                    <select id="signup-notifications" name="notifications" required>
                        <option value="none">None</option>
                        <option value="24h">24 hours before</option>
                        <option value="2h">2 hours before</option>
                    </select>
                </div>
                
                <!-- Address Section -->
                <div class="address-section">
                    <h3 class="section-title">Address Information</h3>
                                    
                    <div class="form-group">
                        <label for="signup-street">Street Address</label>
                        <input type="text" id="signup-street" name="street" required placeholder="Enter your street address">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="signup-city">City</label>
                            <input type="text" id="signup-city" name="city" required placeholder="City">
                        </div>
                        <div class="form-group">
                            <label for="signup-postal">Postal Code</label>
                            <input type="text" id="signup-postal" name="postal_code" required placeholder="Postal code">
                        </div>
                    </div>
                </div>
                
                <!-- Password Section -->
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" required placeholder="Create a password">
                </div>
                
                <div class="form-group">
                    <label for="signup-confirm-password">Confirm Password</label>
                    <input type="password" id="signup-confirm-password" name="confirm_password" required placeholder="Confirm your password">
                </div>
                
                <!-- Terms Agreement (Can be added/uncommented later, if needed)
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="terms-agreement" required>
                        <span class="checkmark"></span>
                        I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a>
                    </label>
                </div>
                -->
                
                <button type="submit" class="auth-btn">Create Account</button>
            </form>
        </div> 
    </div>

    <script src="{{ url_for('static', filename='js/signup.js') }}" defer></script>
</body>
</html>
