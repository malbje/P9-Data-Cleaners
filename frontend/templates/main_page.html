<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Data Cleaners - Mainpage</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>Data Cleaners Dashboard</h1>
            <nav>
                <a href="/">Dashboard</a>
                <a href="/manual">Manual Entry</a>
                <span id="user-info" class="user-info">Loading...</span>
                <a href="/logout" class="logout-btn">Logout</a>
            </nav>
        </header>

        <main class="dashboard-grid">
            <section class="widget-panel">
                <h2>Dashboard</h2>
                <div class="widget-grid">
                    <div class="widget-card" id="vejr-widget" data-widget="vejr">
                        <div class="widget-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M18 10H16.74C16.38 8.83 15.64 7.77 14.62 7.03C13.6 6.29 12.32 5.9 11 5.9C9.68 5.9 8.4 6.29 7.38 7.03C6.36 7.77 5.62 8.83 5.26 10H4C2.9 10 2 10.9 2 12C2 13.1 2.9 14 4 14H18C19.1 14 20 13.1 20 12C20 10.9 19.1 10 18 10Z" fill="currentColor"/>
                            </svg>
                        </div>
                        <div class="widget-title">Vejr</div>
                    </div>
                    
                    <div class="widget-card" id="ugeplan-widget" data-widget="ugeplan">
                        <div class="widget-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M19 3H18V1H16V3H8V1H6V3H5C3.89 3 3.01 3.9 3.01 5L3 19C3 20.1 3.89 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM19 19H5V8H19V19ZM7 10H12V15H7V10Z" fill="currentColor"/>
                            </svg>
                        </div>
                        <div class="widget-title">Ugeplan</div>
                    </div>
                    
                    <div class="widget-card" id="appointments-widget" data-widget="appointments">
                        <div class="widget-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 7.5V9C15 10.1 14.1 11 13 11S11 10.1 11 9V7.5L5 7V9C5 10.1 4.1 11 3 11S1 10.1 1 9V7L7 6.5C7.62 6.19 8.29 6 9 6H15C15.71 6 16.38 6.19 17 6.5L23 7V9C23 10.1 22.1 11 21 11S19 10.1 19 9Z" fill="currentColor"/>
                                <path d="M12 7.5C9.79 7.5 8 9.29 8 11.5V16C8 18.21 9.79 20 12 20S16 18.21 16 16V11.5C16 9.29 14.21 7.5 12 7.5Z" fill="currentColor"/>
                            </svg>
                        </div>
                        <div class="widget-title">Upcoming Appointments</div>
                    </div>
                    
                    <div class="widget-card" id="profile-widget" data-widget="profile">
                        <div class="widget-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" fill="currentColor"/>
                            </svg>
                        </div>
                        <div class="widget-title">My Profile</div>
                    </div>
                </div>
            </section>

            <section class="chatbot-panel">
                <h2>🤖 AI Assistent til Booking</h2>
                <div class="chat-messages" id="chat-messages">
                    <div class="message bot">
                        Hej! How can I help you book a cleaning today? You can say "Book a cleaning for a new customer."
                    </div>
                </div>
                <form class="chat-form" id="chat-form">
                    <input type="text" id="chat-input" placeholder="Skriv din besked her..." autocomplete="off">
                    <button type="submit">Send</button>
                </form>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}" defer></script>
</body>
</html>
